[project]
name = "response-surface-process-window"
version = "0.1.0"
description = "応答曲面法によるプロセスウィンドウの可視化"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "plotly>=5.18,<7",
    "scikit-learn>=1.4,<2",
    "streamlit==1.52.2",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false
